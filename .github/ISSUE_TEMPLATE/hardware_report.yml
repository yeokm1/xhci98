name: Hardware report - it worked, or it did not
description: Tell the project what happened on your machine, working or not
title: "[Hardware] "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        **A machine that works is worth reporting too.** This driver has been
        instrumented mostly in virtual machines; what it has least of is real
        controllers. A one-line "this laptop, this controller, everything came up"
        is genuinely useful, and so is the opposite.

        If something is broken and you want it *fixed*, file a **Bug report**
        instead - it asks for what a fix needs. This form is for the record.

  - type: dropdown
    id: outcome
    attributes:
      label: What happened overall
      options:
        - Works - devices enumerate and run
        - Partly works - some devices or ports do not
        - Driver loads but nothing enumerates
        - Driver does not load / yellow mark on the controller
        - The machine crashes or hangs
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 98 SE
        - Windows ME
        - Windows 2000 SP4
        - Windows 2000, earlier than SP4
        - Windows XP, 32-bit
        - Windows XP, 64-bit
        - Windows Vista, 32-bit
        - Windows Vista, 64-bit
        - Windows 7, 32-bit
        - Windows 7, 64-bit
        - Other / not sure
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine make and model
      placeholder: "ThinkPad E460 / HP EliteDesk 800 G2 / self-built, ASRock B650M"
    validations:
      required: true

  - type: input
    id: driver-version
    attributes:
      label: Driver version
      placeholder: "the four-part number from readme.txt, e.g. 1.1.0.0"
    validations:
      required: true

  - type: textarea
    id: qualifier
    attributes:
      label: XHCIQUAL report
      description: |
        The single most useful thing you can attach. Boot **real DOS** (not a
        DOS box inside Windows), put XHCIQUAL.EXE on writable storage that is
        NOT on the controller being tested, and start with the quick scan:

            XHCIQUAL

        With no arguments it is a read-only one-screen verdict: no log file,
        no PCI configuration write, no ownership taken. A DISQUALIFIED here
        ends it - nothing below can overturn that. Then the probe, still
        read-only, which does write a log:

            XHCIQUAL --probe-only --no-page --log PROBE.LOG

        (`--no-page` matters: without it the run stops every 23 rows waiting
        for a key.)

        If the probe does not crash the machine, the active runs come next.
        They TAKE OVER THE CONTROLLER - reset it, reset its ports - so use a
        PS/2 keyboard. Run them one at a time rather than as one long run,
        **cold-booting between each** (the download carries no batch files;
        these are the command lines, and the numbered .BAT wrappers in the
        repository's xhciqual/ directory run the same ones):

            XHCIQUAL --probe-only --no-page --log PROBE.LOG
            XHCIQUAL xhci --poll-only --no-wait --no-devid --no-page --log XPOLL.LOG
            XHCIQUAL xhci --irq-selftest --no-page --log XIRQ.LOG
            XHCIQUAL xhci --no-wait --no-page --log XEMPTY.LOG   (no external test device attached)
            XHCIQUAL xhci --no-page --log XDEV.LOG               (one expendable USB 2.0 device attached directly)

        Attach whichever of PROBE.LOG, XPOLL.LOG, XIRQ.LOG, XEMPTY.LOG and
        XDEV.LOG you got, or paste them here. Getting only the first one or
        two is still worth reporting. They identify the controller, its
        capabilities, its interrupt pin and its ports - which is most of what
        makes one machine's result transferable to another.
      render: text
    validations:
      required: false

  - type: textarea
    id: devices
    attributes:
      label: What you plugged in, and what it did
      description: |
        Devices and speeds, hubs and how deep, anything that behaved oddly. Worth
        naming: keyboards and mice (Low Speed), flash drives (High Speed), USB
        Ethernet adapters, audio devices, and any hub between them and the machine.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or photos
      description: Drag images in here - the Device Manager tree is the most useful single shot. A phone photo of the screen is fine.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: BIOS settings you had to change (xHCI mode, legacy USB, SATA mode), how the system was installed, anything you would want to know before trying this machine yourself.
    validations:
      required: false
