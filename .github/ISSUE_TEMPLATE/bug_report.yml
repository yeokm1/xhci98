name: Bug report
description: Something does not work, or the machine crashes
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This is a hobby driver for operating systems
        that left support two decades ago, so bugs are expected - what makes a
        report useful is being able to tell your machine apart from everybody
        else's.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 98 SE
        - Windows ME
        - Windows 2000 SP4
        - Windows 2000, earlier than SP4
        - Windows XP, 32-bit
        - Windows XP, 64-bit
        - Windows Vista, 32-bit
        - Windows Vista, 64-bit
        - Windows 7, 32-bit
        - Windows 7, 64-bit
        - Other / not sure
    validations:
      required: true

  - type: input
    id: driver-version
    attributes:
      label: Driver version
      description: The version of the release you downloaded - it is at the top of its readme.txt, and in the driver's properties in Device Manager.
      placeholder: "the four-part number from readme.txt, e.g. 2.0.0.0"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which directory of the download you installed from
      description: release-x86 (or release-x64 on a 64-bit Windows) unless a maintainer asked you for a debug one. If you are not sure, the Version tab of xhci98.sys shows a "debug" flag on the debug build.
      options:
        - release-x86
        - release-x64
        - debug-x86
        - debug-x64
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How the driver got there
      options:
        - A fresh install, no earlier xhci98 driver on this Windows
        - An upgrade over a 1.x.x.x release
        - An update over an earlier 2.x.x.x release
        - Not sure
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine make and model
      description: As specific as you can - the xHCI controller is what matters, and it follows the machine.
      placeholder: "ThinkPad E460 / Dell OptiPlex 7040 / self-built, B650M board"
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: xHCI controller (PCI vendor:device)
      description: XHCIQUAL prints this. Leave it blank if you have not run it.
      placeholder: "8086:9D2F"
    validations:
      required: false

  - type: dropdown
    id: usb-extras
    attributes:
      label: Other USB software on Windows 98 SE or ME
      description: |
        The driver does not need these: it replaces their port and hub drivers.
        What still matters is storage on Windows 98 SE, which needs NUSB's
        mass-storage files (the release notes say why). On Windows 2000, XP,
        Vista or 7, pick "Windows 2000, XP, Vista or 7: nothing extra".
      options:
        - "Windows 98 SE: nothing extra (a stock install)"
        - "Windows 98 SE: NUSB 3.3"
        - "Windows 98 SE: NUSB 3.6"
        - "Windows 98 SE: NUSB, some other version"
        - "Windows 98 SE: only NUSB's mass-storage files"
        - "Windows 98 SE: SweetLow's USB 2.0 stack (Windows 98 QuickInstall)"
        - "Windows ME: SweetLow's USB 2.0 stack"
        - "Windows ME: nothing extra (a stock install)"
        - "Windows 2000, XP, Vista or 7: nothing extra"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: |
        What you did, what you expected, and what the machine did instead. If a
        specific device is involved, say what it is, what speed it should run at
        (SuperSpeed, High, Full or Low), whether it is plugged into the machine
        directly or through a hub (and which hub), and for a storage device
        whether Device Manager shows it as "xHCI98 USB Attached SCSI Storage"
        (UAS) or as an ordinary USB disk.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: Step by step, from a fresh boot if you can. Say whether it happens every time or only sometimes.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or photos
      description: |
        Drag images in here. **A photo of the screen taken with a phone is fine and is
        often the only thing possible** - a machine that has crashed cannot take a
        screenshot. Useful shots: the crash or blue screen in full, the device's
        Properties page in Device Manager (including any error code), and the
        device tree with the xHCI98 controller and its root hub expanded (View,
        Devices by connection).
    validations:
      required: false

  - type: textarea
    id: xhcisnap
    attributes:
      label: XHCISNAP report (the driver's log)
      description: |
        If the machine keeps running, the driver's own log is the most useful
        thing you can send. It is in the download's TOOLS\XHCISNAP directory;
        use the one from the release you installed. From 2.4.0.0 three batch
        files beside XHCISNAP.EXE do it - double-click them, or on Vista and 7
        right-click each and choose Run as administrator:

            SNAPON.BAT        (turns the driver's log channel on)
            (restart Windows)
            SNAPGET.BAT       (once while it works, if you can)
            (make the problem happen)
            SNAPGET.BAT       (again, after it happens)
            SNAPOFF.BAT       (turns the channel off, once you have the files)

        Each SNAPGET.BAT writes its files in the directory it runs in, under a
        name made from the date and time (for example 3141022A.DEV and
        3141022A.TXT for 14 March at 10:22), never overwriting an earlier run,
        and prints the names. Attach the .DEV file (the controller's Device
        Manager status, its resources, and the installed driver files'
        versions and hashes) and the .TXT file (the report: plain text, no
        internal addresses) of each run here. Keep the matching .BIN and .PSC
        files and attach them only if a maintainer asks.

        Without the batch files (or before 2.4.0.0), type what they run, in a
        directory you can write to:

            XHCISNAP -verbosity 2
            (restart Windows, make the problem happen)
            XHCISNAP -report      (before 2.4.0.0: XHCISNAP -o DUMP)
            XHCISNAP -disable

        The log cannot capture a crash; for a crash, the photo above and the
        XHCIQUAL report below are what helps.
        From 2.3.0.0 the top of the .TXT names the Windows version, the
        processor, the memory and, where Windows records them, the make, model
        and BIOS. It does not print the computer name, your user name or the
        domain, and withholds a firmware string that contains one (names of
        three characters or more); if your firmware strings were customised,
        read the top of the .TXT before attaching it.
    validations:
      required: false

  - type: textarea
    id: qualifier
    attributes:
      label: XHCIQUAL report
      description: |
        Boot **real DOS** (not a DOS box inside Windows), copy the download's
        TOOLS\XHCIQUAL directory onto writable storage that is NOT on the
        controller being tested, change to it, and run:

            QUALREP

        QUALREP.BAT (from 2.4.0.0) runs XHCIQUAL --probe-only --no-page
        --log-stamp: the read-only probe - no PCI configuration write, no
        ownership taken - saved to a new log in the current directory named
        from the DOS date and time (for example 3141022A.LOG), never
        overwriting an earlier one. Attach the .LOG file it names here.

        Without the batch file (or before 2.4.0.0), type:

            XHCIQUAL --probe-only --no-page --log PROBE.LOG

        (`--no-page` matters: without it the run stops every 23 rows waiting
        for a key.) Attach PROBE.LOG.

        A maintainer may then ask for the active runs. They TAKE OVER THE
        CONTROLLER - reset it, reset its ports - so use a PS/2 keyboard. Run
        them one at a time rather than as one long run, **cold-booting between
        each** (the download carries no batch file for these; these are the
        command lines, and the numbered .BAT wrappers in the repository's
        xhciqual/ directory run the same ones):

            XHCIQUAL xhci --poll-only --no-wait --no-devid --no-page --log XPOLL.LOG
            XHCIQUAL xhci --irq-selftest --no-page --log XIRQ.LOG
            XHCIQUAL xhci --no-wait --no-page --log XEMPTY.LOG   (no external test device attached)
            XHCIQUAL xhci --no-page --log XDEV.LOG               (one expendable USB 2.0 device attached directly)

        Attach whichever of XPOLL.LOG, XIRQ.LOG, XEMPTY.LOG and XDEV.LOG you
        got to this report, or paste them here. Getting only the probe log is
        still worth reporting.
    validations:
      required: false
