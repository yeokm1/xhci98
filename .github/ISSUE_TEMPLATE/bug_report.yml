name: Bug report
description: Something does not work, or the machine crashes
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This is a hobby driver for two operating systems
        that left support two decades ago, so bugs are expected - what makes a
        report useful is being able to tell your machine apart from everybody
        else's.

        **Please check the known limitations first:**
        [docs/using/release-notes.md](https://github.com/yeokm1/xhci98/blob/main/docs/using/release-notes.md).
        Several known problems are in the USB stack this driver plugs into rather
        than in the driver, and they are listed there with what was measured.

        **One thing is already known and is not a bug in this driver:**
        disabling, removing or upgrading the driver in Device Manager blue-screens
        Windows 98 (Microsoft's own USB drivers do the same on the same machine).

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 98 SE
        - Windows 2000 SP4
        - Windows 2000, earlier than SP4
        - Windows XP, 32-bit
        - Other / not sure
    validations:
      required: true

  - type: input
    id: driver-version
    attributes:
      label: Driver version
      description: The version of the release you downloaded - it is at the top of its readme.txt, and in the driver's properties in Device Manager.
      placeholder: "1.0.0.0"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which build is installed
      description: RELEASE unless a maintainer asked you for the other one. If you are not sure, the Version tab of xhci98.sys shows a "debug" flag on the debug build. Either build answers XHCISNAP, so you do not need to change builds to send a report.
      options:
        - release
        - debug
        - Not sure
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine make and model
      description: As specific as you can - the xHCI controller is what matters, and it follows the machine.
      placeholder: "ThinkPad E460 / Dell OptiPlex 7040 / self-built, B650M board"
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: xHCI controller (PCI vendor:device)
      description: XHCIQUAL prints this. Leave it blank if you have not run it.
      placeholder: "8086:9D2F"
    validations:
      required: false

  - type: dropdown
    id: usb-stack
    attributes:
      label: The USB stack underneath
      description: This driver is only the controller layer; it needs the USB 2.0 stack already installed.
      options:
        - "Windows 98: NUSB 3.3 installed"
        - "Windows 98: NUSB, some other version"
        - "Windows 98: no NUSB / not sure"
        - "Windows 2000: SP4's own stack"
        - "Windows 2000: the standalone KB319973 update"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what the machine did instead. If a specific device is involved, say what it is and what speed it should run at.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: Step by step, from a fresh boot if you can. Say whether it happens every time or only sometimes.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or photos
      description: |
        Drag images in here. **A photo of the screen taken with a phone is fine and is
        often the only thing possible** - a machine that has crashed cannot take a
        screenshot. Useful shots: the crash or blue screen in full, the device's
        Properties page in Device Manager (including any error code), and the xHCI
        controller's entry in the device tree.
    validations:
      required: false

  - type: textarea
    id: qualifier
    attributes:
      label: XHCIQUAL report
      description: |
        Boot **real DOS** (not a DOS box inside Windows) and run:

            XHCIQUAL --probe-only --no-page --log PROBE.LOG

        That is read-only - it takes ownership of nothing and writes no PCI
        configuration register. Attach PROBE.LOG, or paste it here.
      render: text
    validations:
      required: false

  - type: textarea
    id: driver-log
    attributes:
      label: XHCISNAP report
      description: |
        The download carries XHCISNAP.EXE, in the XHCISNAP\
        directory. It works the same on **both** Windows 98 and Windows 2000, and
        it is what a report should carry - four steps, and none of them is
        REGEDIT:

            1.  XHCISNAP -verbosity 2
            2.  restart the machine
            3.  make the problem happen again
            4.  XHCISNAP -o C:\MYDUMP

        Then attach C:\MYDUMP.TXT, or paste it here. Attach C:\MYDUMP.BIN too if
        you are asked for it. Run XHCISNAP -disable once you have sent it: while
        the channel is on, anyone using the machine can read the driver's
        diagnostic state through it.

        It answers nothing about a crash - a machine that has blue-screened is
        not running for anything to read. In that case the photo above is the
        report, and this field stays empty.

        **Step 1 is not optional.** The driver answers nothing until it is asked
        to and reads that setting only when it starts, so a dump taken without
        step 1 and the restart comes back correct and empty. The XHCISNAP\
        readme.txt in the download explains the levels; level 2 is the one to
        send.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the known limitations in the release notes and this is not one of them
          required: true
        - label: I am running the RELEASE build, or I am reporting something that only happens on the DEBUG one
          required: true
